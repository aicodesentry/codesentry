rules:
  - id: cwe-78.ruby-system-exec
    patterns:
      - pattern-either:
        - pattern: system($CMD)
        - pattern: exec($CMD)
        - pattern: "`#{$CMD}`"
        - pattern: IO.popen($CMD)
        - pattern: Open3.capture3($CMD)
    message: "Shell command execution with variable input — use shellescape and argument arrays"
    severity: ERROR
    languages: [ruby]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      confidence: "0.88"

  - id: cwe-89.ruby-sql-interpolation
    patterns:
      - pattern-either:
        - pattern: $MODEL.where("...#{$INPUT}...")
        - pattern: $MODEL.find_by_sql("...#{$INPUT}...")
        - pattern: ActiveRecord::Base.connection.execute("...#{$INPUT}...")
    message: "SQL query with string interpolation — use parameterized queries"
    severity: ERROR
    languages: [ruby]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      confidence: "0.90"

  - id: cwe-502.ruby-marshal-load
    patterns:
      - pattern-either:
        - pattern: Marshal.load(...)
        - pattern: Marshal.restore(...)
        - pattern: YAML.load($INPUT)
    message: "Deserialization of untrusted data — use YAML.safe_load or JSON"
    severity: ERROR
    languages: [ruby]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      confidence: "0.92"

  - id: cwe-95.ruby-eval
    patterns:
      - pattern-either:
        - pattern: eval($INPUT)
        - pattern: instance_eval($INPUT)
        - pattern: class_eval($INPUT)
        - pattern: send($METHOD, ...)
        - pattern: public_send($METHOD, ...)
        - pattern: $CLASS.constantize
    message: "Dynamic code execution — avoid eval, send with user input, and constantize"
    severity: ERROR
    languages: [ruby]
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021"
      category: "code injection"
      confidence: "0.88"

  - id: cwe-79.ruby-xss-raw
    patterns:
      - pattern-either:
        - pattern: raw($INPUT)
        - pattern: html_safe
        - pattern: "render inline: $INPUT"
    message: "Unescaped HTML output — use ERB auto-escaping or sanitize helper"
    severity: WARNING
    languages: [ruby]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      confidence: "0.82"

  - id: cwe-601.ruby-open-redirect
    patterns:
      - pattern-either:
        - pattern: redirect_to(params[...])
        - pattern: redirect_to($INPUT)
    message: "Redirect with user-controlled URL — validate against trusted domains"
    severity: WARNING
    languages: [ruby]
    metadata:
      cwe: "CWE-601"
      owasp: "A01:2021"
      category: "open redirect"
      confidence: "0.78"

  - id: cwe-798.ruby-hardcoded-secret
    patterns:
      - pattern-either:
        - pattern: $KEY = "..."
      - metavariable-regex:
          metavariable: $KEY
          regex: .*(password|secret|api_key|token|private_key).*
    message: "Hardcoded credential — use Rails credentials or environment variables"
    severity: ERROR
    languages: [ruby]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: "hardcoded secrets"
      confidence: "0.85"

  - id: cwe-22.ruby-path-traversal
    patterns:
      - pattern-either:
        - pattern: File.read("...#{$INPUT}...")
        - pattern: File.open("...#{$INPUT}...")
        - pattern: send_file(params[...])
    message: "File access with user-controlled path — use File.basename and allowlists"
    severity: WARNING
    languages: [ruby]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      confidence: "0.85"
