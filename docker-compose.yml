version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mitig8it-postgres
    environment:
      POSTGRES_DB: codesentry
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d codesentry"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mitig8it-net

  api-service:
    build:
      context: ./services/api-service
      dockerfile: Dockerfile
    container_name: mitig8it-api
    env_file: [.env]
    ports:
      - "3000:3000"
    environment:
      # Overrides: docker-internal hostnames and ports
      PORT: 3000
      DATABASE_URL: postgresql://dev:${POSTGRES_PASSWORD:-devpass123}@postgres:5432/codesentry
      ANALYSIS_SERVICE_URL: http://analysis-service:8001
      GITHUB_SERVICE_URL: http://github-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      github-service:
        condition: service_started
      analysis-service:
        condition: service_started
    volumes:
      - ./services/api-service:/app
      - /app/node_modules
    networks:
      - mitig8it-net

  github-service:
    build:
      context: ./services/github-service
      dockerfile: Dockerfile
    container_name: mitig8it-github
    env_file: [.env]
    expose:
      - "3002"
    environment:
      # Overrides: docker-internal hostnames, ports, and secret alias
      PORT: 3002
      DATABASE_URL: postgresql://dev:${POSTGRES_PASSWORD:-devpass123}@postgres:5432/codesentry
      # Alias: github-service expects WEBHOOK_SECRET, root .env uses GITHUB_WEBHOOK_SECRET
      WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-webhook-secret}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/github-service:/app
      - /app/node_modules
    networks:
      - mitig8it-net

  analysis-service:
    build:
      context: ./services/analysis-service
      dockerfile: Dockerfile
    container_name: mitig8it-analysis
    env_file: [.env]
    expose:
      - "8001"
    environment:
      # Override: port
      PORT: 8001
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./services/analysis-service:/app
    networks:
      - mitig8it-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mitig8it-frontend
    env_file: [.env]
    ports:
      - "5173:5173"
    depends_on:
      api-service:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mitig8it-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mitig8it-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api-service:
        condition: service_started
      github-service:
        condition: service_started
      analysis-service:
        condition: service_started
    networks:
      - mitig8it-net

networks:
  mitig8it-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
