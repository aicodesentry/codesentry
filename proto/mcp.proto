syntax = "proto3";

package mcp;

message GetAnalysisContextRequest {
  string pull_request_url = 1; // URL of the pull request
  string repository_id = 2;    // ID of the repository
  string commit_id = 3;        // The commit to analyze
}

message AnalysisContext {
  string file_path = 1;
  string file_content = 2;
  // Potentially more fields like diffs, relevant code snippets, etc.
}

message AnalysisContextResponse {
  repeated AnalysisContext contexts = 1;
  string message = 2; // Optional message for status or errors
}

service McpService {
  rpc GetAnalysisContext(GetAnalysisContextRequest) returns (AnalysisContextResponse);
}