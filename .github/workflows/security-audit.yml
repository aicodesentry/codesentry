name: Security audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  npm-audit:
    name: npm audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            directory: frontend
            lockfile: frontend/package-lock.json
          - name: api-service
            directory: services/api-service
            lockfile: services/api-service/package-lock.json
          - name: github-service
            directory: services/github-service
            lockfile: services/github-service/package-lock.json
          - name: proto-js
            directory: proto
            lockfile: proto/package-lock.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.directory }}

  pip-audit:
    name: pip-audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: analysis-service
            directory: services/analysis-service/src
            requirements: requirements.txt
            audit_args: >-
              --ignore-vuln PYSEC-2026-3481
              --ignore-vuln PYSEC-2026-3482
              --ignore-vuln PYSEC-2026-3483
          - name: proto-py
            directory: proto
            requirements: requirements.txt
            audit_args: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      # Semgrep 1.172.0 pins mcp 1.23.3. Keep these ignored until Semgrep
      # ships a compatible release with mcp >=1.28.1.
      - run: pip-audit -r "${{ matrix.requirements }}" ${{ matrix.audit_args }}
        working-directory: ${{ matrix.directory }}
