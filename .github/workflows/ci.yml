name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel duplicate runs on feature branches; do not cancel on main (avoids
# aborting the run that deploy workflows wait on when pushes are back-to-back).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: only what these jobs need. dependency-review uses the
# default GITHUB_TOKEN to read the dependency graph and PR diff.
permissions:
  contents: read
  pull-requests: read

jobs:
  # --- Repo-wide security (blocks deploy with the same "CI" workflow) ---

  security-gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Compares base vs head dependency changes on PRs. Private repos need
  # GitHub Advanced Security; public repos work out of the box.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          # Change to critical if moderate/high noise is too high.
          fail-on-severity: high

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api-service/package-lock.json
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test -- --runInBand

  github-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/github-service
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/github-service/package-lock.json
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test -- --runInBand

  analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-service/src
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            services/analysis-service/src/requirements.txt
            services/analysis-service/src/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pip install pip-audit bandit
      - name: pip-audit (runtime requirements)
        run: pip-audit -r requirements.txt
      # B608 skipped: Bandit flags LLM prompt strings as "SQL injection".
      - name: bandit
        run: >
          bandit -r . -ll -q
          -x ./tests -x ./grpc_generated -x ./grpc_server/generated
          -s B608
      - run: pytest tests -q

  docker-build:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-service
          - github-service
          - analysis-service
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: docker build
        run: docker build "./services/${{ matrix.service }}"
