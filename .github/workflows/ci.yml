name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: only what these jobs need. dependency-review uses the
# default GITHUB_TOKEN to read the dependency graph and PR diff.
permissions:
  contents: read
  pull-requests: read

jobs:
  # --- Repo-wide security (blocks deploy with the same "CI" workflow) ---

  security-gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Compares base vs head dependency changes on PRs. Private repos need
  # GitHub Advanced Security; public repos work out of the box.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Change to critical if moderate/high noise is too high.
          fail-on-severity: high

  # --- Service tests ---

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api-service/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand

  analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-service/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_pipeline.py
