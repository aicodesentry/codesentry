name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api-service/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand

  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/worker-service/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand

  analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-service/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_pipeline.py
