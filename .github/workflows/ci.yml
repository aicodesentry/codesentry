name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api-service/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand

  github-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/github-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/github-service/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand

  analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-service/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/analysis-service/src/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest tests -q
