name: Dependabot auto-merge

# Auto-merges low-risk Dependabot PRs (minor/patch) once required CI checks pass.
# Major version bumps are skipped so they get a human review.
# Requires: repo setting "Allow auto-merge" ON, plus branch protection on main
# with required status checks (auto-merge only merges after those pass).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for minor/patch updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
