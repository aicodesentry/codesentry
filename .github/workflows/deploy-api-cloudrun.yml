name: Deploy API (Cloud Run)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudrun-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: Reset Docker auth
        run: |
          rm -f "$HOME/.docker/config.json"
          docker logout docker.io || true
          docker logout registry-1.docker.io || true

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Load API migration secrets
        run: |
          echo "DATABASE_URL=$(gcloud secrets versions access latest --secret=codesentry-database-url | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Set release metadata
        run: |
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "IMAGE=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:api-${DEPLOY_SHA::12}" >> "$GITHUB_ENV"

      - name: Build API image
        run: |
          docker build -t "$IMAGE" ./services/api-service
          docker push "$IMAGE"

      - name: Run API migrations from release image
        env:
          NODE_ENV: production
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NODE_ENV="$NODE_ENV" \
            "$IMAGE" \
            npm run db:migrate

      - name: Deploy API
        run: |
          gcloud run deploy codesentry-api \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --platform managed \
            --update-env-vars "\
              NODE_ENV=production,\
              FRONTEND_URL=${{ vars.CODESENTRY_FRONTEND_URL }},\
              GITHUB_SERVICE_URL=${{ vars.CODESENTRY_GH_SERVICE_URL }},\
              ANALYSIS_SERVICE_URL=${{ vars.CODESENTRY_ANALYSIS_URL }},\
              GITHUB_CALLBACK_URL=${{ vars.CODESENTRY_FRONTEND_URL }}/auth/github/callback,\
              GITHUB_APP_SLUG=mitig8it,\
              GITHUB_SERVICE_INTERNAL_SECRET=${{ secrets.CODESENTRY_INTERNAL_SECRET }}" \
            --set-secrets "\
              JWT_SECRET=codesentry-jwt-secret:latest,\
              ENCRYPTION_KEY=codesentry-encryption-key:latest,\
              DATABASE_URL=codesentry-database-url:latest,\
              GITHUB_APP_ID=codesentry-github-app-id:latest,\
              GITHUB_APP_PRIVATE_KEY=codesentry-github-app-private-key:latest,\
              GITHUB_WEBHOOK_SECRET=codesentry-webhook-secret:latest,\
              GITHUB_CLIENT_ID=codesentry-github-client-id:latest,\
              GITHUB_CLIENT_SECRET=codesentry-github-client-secret:latest" \
            --allow-unauthenticated
