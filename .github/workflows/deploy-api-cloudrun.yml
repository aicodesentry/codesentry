name: Deploy API (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'services/api-service/**'
      - '.github/workflows/deploy-api-cloudrun.yml'
  workflow_dispatch:

concurrency:
  group: cloudrun-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build API image
        run: |
          TAG="api-${GITHUB_SHA::12}"
          IMAGE="us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:${TAG}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" ./services/api-service
          docker push "$IMAGE"

      - name: Deploy API
        run: |
          gcloud run deploy codesentry-api \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --platform managed \
            --update-env-vars "\
              NODE_ENV=production,\
              FRONTEND_URL=${{ vars.CODESENTRY_FRONTEND_URL }},\
              GITHUB_SERVICE_URL=${{ vars.CODESENTRY_GH_SERVICE_URL }},\
              ANALYSIS_SERVICE_URL=${{ vars.CODESENTRY_ANALYSIS_URL }},\
              GITHUB_CALLBACK_URL=${{ vars.CODESENTRY_GH_CALLBACK_URL }},\
              GITHUB_APP_SLUG=${{ vars.CODESENTRY_GH_APP_SLUG }},\
              GITHUB_SERVICE_INTERNAL_SECRET=${{ secrets.CODESENTRY_INTERNAL_SECRET }},\
              GITHUB_WEBHOOK_SECRET=${{ secrets.CODESENTRY_WEBHOOK_SECRET }},\
              GITHUB_CLIENT_ID=${{ secrets.CODESENTRY_GH_CLIENT_ID }},\
              GITHUB_CLIENT_SECRET=${{ secrets.CODESENTRY_GH_CLIENT_SECRET }}" \
            --set-secrets "\
              JWT_SECRET=codesentry-jwt-secret:latest,\
              ENCRYPTION_KEY=codesentry-encryption-key:latest,\
              DATABASE_URL=codesentry-database-url:latest,\
              GITHUB_APP_ID=codesentry-github-app-id:latest,\
              GITHUB_APP_PRIVATE_KEY=codesentry-github-app-private-key:latest" \
            --allow-unauthenticated
