name: Deploy API (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'services/api-service/**'
      - '.github/workflows/deploy-api-cloudrun.yml'
  workflow_dispatch:

concurrency:
  group: cloudrun-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: Validate required config
        run: |
          test -n "${{ vars.CODESENTRY_GH_SERVICE_URL }}" || (echo "Missing repo variable: CODESENTRY_GH_SERVICE_URL" && exit 1)
          test -n "${{ vars.CODESENTRY_ANALYSIS_URL }}" || (echo "Missing repo variable: CODESENTRY_ANALYSIS_URL" && exit 1)
          test -n "${{ secrets.CODESENTRY_INTERNAL_SECRET }}" || (echo "Missing repo secret: CODESENTRY_INTERNAL_SECRET" && exit 1)

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build API image
        run: |
          TAG="api-${GITHUB_SHA::12}"
          IMAGE="us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:${TAG}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" ./services/api-service
          docker push "$IMAGE"

      - name: Deploy API
        run: |
          gcloud run deploy codesentry-api \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --platform managed \
            --update-env-vars "PORT=8080" \
            --update-env-vars "GITHUB_SERVICE_URL=${{ vars.CODESENTRY_GH_SERVICE_URL }}" \
            --update-env-vars "ANALYSIS_SERVICE_URL=${{ vars.CODESENTRY_ANALYSIS_URL }}" \
            --update-env-vars "GITHUB_SERVICE_INTERNAL_SECRET=${{ secrets.CODESENTRY_INTERNAL_SECRET }}" \
            --allow-unauthenticated
