name: Deploy GitHub Service (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'services/github-service/**'
      - '.github/workflows/deploy-github-cloudrun.yml'
  workflow_dispatch:

concurrency:
  group: cloudrun-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: Validate required config
        run: |
          test -n "${{ secrets.GITHUB_SERVICE_INTERNAL_SECRET }}" || (echo "Missing repo secret: GITHUB_SERVICE_INTERNAL_SECRET" && exit 1)
          test -n "${{ vars.GITHUB_APP_ID }}" || (echo "Missing repo variable: GITHUB_APP_ID" && exit 1)
          test -n "${{ secrets.GITHUB_APP_PRIVATE_KEY }}" || (echo "Missing repo secret: GITHUB_APP_PRIVATE_KEY" && exit 1)
          test -n "${{ secrets.GITHUB_WEBHOOK_SECRET }}" || (echo "Missing repo secret: GITHUB_WEBHOOK_SECRET" && exit 1)

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build GitHub Service image
        run: |
          TAG="github-${GITHUB_SHA::12}"
          IMAGE="us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/github:${TAG}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" ./services/github-service
          docker push "$IMAGE"

      - name: Deploy GitHub Service
        run: |
          gcloud run deploy codesentry-github \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --platform managed \
            --update-env-vars "PORT=8080" \
            --update-env-vars "GITHUB_SERVICE_INTERNAL_SECRET=${{ secrets.GITHUB_SERVICE_INTERNAL_SECRET }}" \
            --update-env-vars "GITHUB_APP_ID=${{ vars.GITHUB_APP_ID }}" \
            --update-env-vars "GITHUB_APP_PRIVATE_KEY=${{ secrets.GITHUB_APP_PRIVATE_KEY }}" \
            --update-env-vars "WEBHOOK_SECRET=${{ secrets.GITHUB_WEBHOOK_SECRET }}" \
            --allow-unauthenticated
